[package]
name = "warren"
version = "0.1.2"
edition = "2024"
description = "A terminal IDE that wraps the Claude Code CLI: file explorer, editor, embedded claude pane, git, and live accept/reject diffs."
license = "MIT"
repository = "https://github.com/Yok4ai/warren"
homepage = "https://github.com/Yok4ai/warren"
readme = "README.md"
keywords = ["tui", "ide", "claude", "terminal", "editor"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
futures-util = "0.3.32"
git2 = { version = "0.19", default-features = false }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
notify = "8.2.0"
nucleo-matcher = "0.3.1"
once_cell = "1.21.4"
portable-pty = "0.9.0"
pulldown-cmark = "0.13.4"
ratatui = "0.29.0"
ratatui-image = "8.0.1"
ropey = "1.6.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
similar = "3.1.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = "0.29.0"
toml = "1.1.2"
tui-term = "0.2.0"
ureq = "2"
vt100 = "0.15.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
