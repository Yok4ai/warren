name: release

# Build prebuilt binaries for Linux + macOS and attach them to the GitHub Release
# whenever a v* tag is pushed. install.sh downloads these assets.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  upload:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Builds the binary (cross-compiling Linux targets via `cross` when needed), packs it as
      # warren-<target>.tar.gz alongside the README/LICENSE, and uploads it to the release.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: warren
          target: ${{ matrix.target }}
          archive: warren-$target
          include: README.md,LICENSE
          token: ${{ secrets.GITHUB_TOKEN }}
