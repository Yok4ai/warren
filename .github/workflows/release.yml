name: release

# Build prebuilt binaries for Linux + macOS and attach them to the GitHub Release
# whenever a v* tag is pushed. install.sh downloads these assets.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Create the GitHub Release first; the upload jobs attach binaries to it.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "warren $TAG" \
              --notes "Prebuilt binaries for Linux (x86_64/arm64) and macOS (Intel/Apple Silicon). Install: curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/install.sh | sh"

  upload:
    needs: create-release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Builds the binary (cross-compiling Linux targets via `cross` when needed), packs it as
      # warren-<target>.tar.gz alongside the README/LICENSE, and uploads it to the release.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: warren
          target: ${{ matrix.target }}
          archive: warren-$target
          include: README.md,LICENSE
          token: ${{ secrets.GITHUB_TOKEN }}
